# همه‌ی تست‌های اپ با هم (دستی از Actions، یا با هر بارگذاری روی شاخه‌های release-*)؛ گزارش در خروجی همین اجرا
name: All tests
on:
  workflow_dispatch:
  push:
    branches:
      - 'release-*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens 2>&1 | tee test-log.txt
      - name: failures as an annotation (the log file is not always reachable)
        if: always()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test-log.txt | grep -A9 -E 'The following (assertion|TestFailure)' | grep -v 'package:flutter' | head -150 > fails.txt || true
          if [ -s fails.txt ]; then echo "::error title=failing tests::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' fails.txt)"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test-log.txt
